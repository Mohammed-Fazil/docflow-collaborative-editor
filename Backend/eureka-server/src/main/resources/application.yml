server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
      hostname: localhost
      prefer-ip-address: true
      ip-address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: "*"