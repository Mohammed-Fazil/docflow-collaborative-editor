server:
  port: 8082

spring:
  application:
    name: document-service

  datasource:
    url: jdbc:postgresql://localhost:5432/docflow
    username: postgres
    password: secret

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: localhost:${spring.application.name}:${server.port}

jwt:
  secret: mySuperSecretKeyThatIsAtLeast32CharactersLong

  access-token-expiration: 900000

  refresh-token-expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: "*"