server:
  port: 8083

spring:
  application:
    name: collaboration-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: localhost:${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"