server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-route
          uri: lb://USER-SERVICE

          predicates:
            - Path=/api/auth/**

          filters:
            - StripPrefix=1

        - id: user-route
          uri: lb://USER-SERVICE

          predicates:
            - Path=/me

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: "*"